<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anergi Vector Icon Catalog (16 Extracted Tech Icons)</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --accent-orange: #ff6600;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 3rem 1.5rem; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 3.5rem; }
    h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 0.75rem; }
    h1 span { color: var(--accent-orange); }
    p.subtitle { color: var(--text-muted); font-size: 1.05rem; max-width: 750px; margin: 0 auto 1.5rem; }
    
    .source-info {
      display: inline-flex; gap: 1rem; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 9999px; padding: 0.5rem 1.25rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #cbd5e1;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.75rem;
    }

    .icon-card {
      background: var(--bg-card);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.25s ease;
      position: relative;
    }

    .icon-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-orange);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .badge-number {
      position: absolute; top: 1rem; left: 1rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700;
      color: var(--accent-orange); background: rgba(255, 102, 0, 0.12);
      padding: 0.2rem 0.6rem; border-radius: 6px; border: 1px solid rgba(255, 102, 0, 0.3);
    }

    .preview-box {
      width: 140px; height: 140px;
      margin: 1.5rem 0 1.25rem;
      display: flex; align-items: center; justify-content: center;
      background: #ffffff;
      border-radius: 14px;
      padding: 8px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
    }

    .preview-box img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .icon-title { font-size: 1.05rem; font-weight: 700; color: #ffffff; margin-bottom: 0.4rem; }
    .icon-filename {
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      color: var(--text-muted); margin-bottom: 1rem;
      background: rgba(0, 0, 0, 0.25); padding: 0.3rem 0.6rem; border-radius: 6px;
      word-break: break-all;
    }

    .copy-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      color: #fff;
    }

    @media (max-width: 1024px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Anergi <span>16 Tech Icons</span> Catalog</h1>
      <p class="subtitle">
        Individually extracted in high-resolution from your 2 Gemini source sheets. Available in both bordered PNG and clean transparent PNG formats to slot into any section.
      </p>
      <div class="source-info">
        <span><i class="fa-solid fa-layer-group"></i> 16 Total Icons</span>
        <span>&bull;</span>
        <span><i class="fa-solid fa-file-image"></i> High-Res 658&times;635 PNGs</span>
        <span>&bull;</span>
        <span><i class="fa-solid fa-wand-magic-sparkles"></i> Transparent Versions Ready</span>
      </div>
    </header>

    <div class="gallery-grid" id="iconGrid">
      <!-- Cards rendered via simple JS loop -->
    </div>
  </div>

  <script>
    const icons = [
      { id: 1, file: 'anergi_icon_01.png', trans: 'anergi_icon_01_trans.png', sheet: 'Sheet 1 (Top Left)' },
      { id: 2, file: 'anergi_icon_02.png', trans: 'anergi_icon_02_trans.png', sheet: 'Sheet 1 (Top Mid-Left)' },
      { id: 3, file: 'anergi_icon_03.png', trans: 'anergi_icon_03_trans.png', sheet: 'Sheet 1 (Top Mid-Right)' },
      { id: 4, file: 'anergi_icon_04.png', trans: 'anergi_icon_04_trans.png', sheet: 'Sheet 1 (Top Right)' },
      { id: 5, file: 'anergi_icon_05.png', trans: 'anergi_icon_05_trans.png', sheet: 'Sheet 1 (Bottom Left)' },
      { id: 6, file: 'anergi_icon_06.png', trans: 'anergi_icon_06_trans.png', sheet: 'Sheet 1 (Bottom Mid-Left)' },
      { id: 7, file: 'anergi_icon_07.png', trans: 'anergi_icon_07_trans.png', sheet: 'Sheet 1 (Bottom Mid-Right)' },
      { id: 8, file: 'anergi_icon_08.png', trans: 'anergi_icon_08_trans.png', sheet: 'Sheet 1 (Bottom Right)' },
      { id: 9, file: 'anergi_icon_09.png', trans: 'anergi_icon_09_trans.png', sheet: 'Sheet 2 (Top Left)' },
      { id: 10, file: 'anergi_icon_10.png', trans: 'anergi_icon_10_trans.png', sheet: 'Sheet 2 (Top Mid-Left)' },
      { id: 11, file: 'anergi_icon_11.png', trans: 'anergi_icon_11_trans.png', sheet: 'Sheet 2 (Top Mid-Right)' },
      { id: 12, file: 'anergi_icon_12.png', trans: 'anergi_icon_12_trans.png', sheet: 'Sheet 2 (Top Right)' },
      { id: 13, file: 'anergi_icon_13.png', trans: 'anergi_icon_13_trans.png', sheet: 'Sheet 2 (Bottom Left)' },
      { id: 14, file: 'anergi_icon_14.png', trans: 'anergi_icon_14_trans.png', sheet: 'Sheet 2 (Bottom Mid-Left)' },
      { id: 15, file: 'anergi_icon_15.png', trans: 'anergi_icon_15_trans.png', sheet: 'Sheet 2 (Bottom Mid-Right)' },
      { id: 16, file: 'anergi_icon_16.png', trans: 'anergi_icon_16_trans.png', sheet: 'Sheet 2 (Bottom Right)' }
    ];

    const grid = document.getElementById('iconGrid');

    icons.forEach(ic => {
      const card = document.createElement('div');
      card.className = 'icon-card';
      card.innerHTML = `
        <span class="badge-number">#${String(ic.id).padStart(2, '0')}</span>
        <div class="preview-box">
          <img src="assets/icons/extracted/${ic.file}" alt="Icon ${ic.id}">
        </div>
        <h3 class="icon-title">Anergi Icon ${String(ic.id).padStart(2, '0')}</h3>
        <span class="icon-filename">assets/icons/extracted/${ic.file}</span>
        <button class="copy-btn" onclick="copyTag('${ic.file}')">
          <i class="fa-regular fa-copy"></i> Copy HTML &lt;img&gt;
        </button>
      `;
      grid.appendChild(card);
    });

    function copyTag(filename) {
      const snippet = `<img src="assets/icons/extracted/${filename}" alt="Anergi Security Icon" class="custom-card-icon" style="width: 64px; height: 64px; object-fit: contain;">`;
      navigator.clipboard.writeText(snippet).then(() => {
        alert('Copied HTML tag for ' + filename + ' to clipboard!');
      });
    }
  </script>
</body>
</html>
